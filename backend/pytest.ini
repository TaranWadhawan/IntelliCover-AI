[pytest]
# ──────────────────────────────────────────────────────────────────────────────
# pytest configuration
# ──────────────────────────────────────────────────────────────────────────────

# Set the default PYTHONPATH so tests can import from app/
pythonpath = .

# Async test mode (for testing async FastAPI endpoints with pytest-asyncio)
asyncio_mode = auto
# All async fixtures and tests share one event loop per session to avoid
# "Future attached to a different loop" errors with asyncpg
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output verbosity
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov

# Custom markers (register to avoid PytestUnknownMarkWarning)
markers =
    unit: marks tests as unit tests (fast, no external dependencies)
    integration: marks tests as integration tests (may require DB/Redis)
    nlp: marks tests that load NLP models (slow)
    e2e: marks tests as end-to-end tests
